# UC_TPA v1 configuration  |  Developer: UC_Hussein

# Chat prefix shown before every message:  TPA│ message
prefix:
  text: "TPA"
  # Red gradient (light -> dark) and a calm grey separator. Hex colours only.
  gradient-start: "#ff5a4d"
  gradient-end: "#8b0000"
  separator: "│"
  separator-color: "#8a8a8a"

chat:
  # Chat window width in pixels (default 320). The [ OPEN ] / [ CANCEL ] buttons are centred using this value.
  width: 320

# Seconds before a request expires.
request-expiration: 60
# Seconds a player must wait between two sent requests.
send-cooldown: 15
# Seconds of countdown after a request is accepted.
teleport-countdown: 3
# Cancel the teleport if the travelling player moves to another block.
cancel-on-move: true
# Cancel pending requests / countdowns when one of the two players disconnects.
# If false, requests stay valid until they expire (players who log back in can still answer them).
cancel-on-quit: true

# Worlds (by name) where teleport requests are not allowed (sending, accepting and the final teleport).
# You can edit this list here, or manage it in game: /uc_tpa world disable|enable|list [world]
disabled-worlds: []

# Automatic acceptance: players can turn it on with /tpauto, /tpa auto or in /tpasetting.
auto-accept:
  # Set to false to remove the feature from the server completely.
  enabled: true
  # Also auto-accept /tpahere requests (the player is moved to the sender). Set to false to keep those manual.
  allow-tpahere: true

language:
  default: EN
  allowed:
    - EN
    - AR

sounds:
  enabled: true

actionbar:
  # Teleport countdown above the hearts (each player can turn it off in /tpasetting).
  enabled: true
  # Short alert above the hearts when a request arrives, e.g. "TPA • Steve" (each player can turn it off in /tpasetting).
  request-alert: true

auto-open-gui:
  default: false

player-info:
  enabled: true
  show-world: true
  show-location: true

# Try to take over /tpa, /tpahere, /tpaccept, /tpadeny, /tpacancel, /tpasetting from other plugins.
command-override:
  enabled: true
